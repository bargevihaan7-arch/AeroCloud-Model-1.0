version: '3.8'

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: aerocloud_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  app:
    build: .
    container_name: aerocloud_app
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3:8b-instruct-q4_K_M
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
