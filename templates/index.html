<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerocloud AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #e6edf3; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 260px; background-color: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #30363d; display: flex; flex-direction: column; gap: 12px; }
        .new-chat-btn { background-color: #238636; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center; font-size: 0.9rem; }
        .new-chat-btn:hover { background-color: #2ea043; }
        .sidebar-chats { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .chat-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; color: #c9d1d9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; }
        .chat-item:hover { background-color: #21262d; color: #ffffff; }
        .chat-item.active { background-color: #1f6feb; color: #ffffff; }
        .chat-del { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; }
        .chat-del:hover { background: rgba(248,81,73,0.2); color: #f85149; }
        #main-area { flex: 1; display: flex; flex-direction: column; height: 100vh; background-color: #0d1117; }
        header { background-color: #161b22; padding: 14px 24px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        header h1 { font-size: 1.15rem; color: #58a6ff; letter-spacing: 0.5px; }
        .controls { display: flex; gap: 8px; align-items: center; }
        .btn-sm { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
        .btn-sm:hover { border-color: #58a6ff; color: #ffffff; }
        .btn-danger:hover { border-color: #f85149; color: #f85149; }
        #chat-box { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        #welcome-screen { margin: auto; text-align: center; max-width: 600px; padding: 20px; }
        #welcome-screen h2 { font-size: 3rem; font-weight: 700; background: linear-gradient(90deg, #58a6ff, #a371f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .msg { max-width: 80%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; word-break: break-word; }
        .user { align-self: flex-end; background-color: #1f6feb; color: #ffffff; border-bottom-right-radius: 2px; white-space: pre-wrap; }
        .ai { align-self: flex-start; background-color: #161b22; border: 1px solid #30363d; border-bottom-left-radius: 2px; width: 100%; max-width: 90%; }
        pre { background-color: #0d1117 !important; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin: 10px 0; overflow-x: auto; position: relative; }
        code { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 0.85rem; color: #e6edf3; }
        p code, li code { background-color: rgba(110,118,129,0.2); padding: 2px 6px; border-radius: 4px; color: #79c0ff; }
        .copy-btn { position: absolute; top: 8px; right: 8px; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
        .copy-btn:hover { background: #30363d; color: #ffffff; }
        #input-area { background-color: #161b22; padding: 16px 24px; border-top: 1px solid #30363d; display: flex; gap: 12px; }
        input { flex: 1; background-color: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 12px 16px; border-radius: 8px; font-size: 1rem; outline: none; }
        input:focus { border-color: #58a6ff; }
        #send-btn { background-color: #238636; color: white; border: none; padding: 0 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        #send-btn:hover { background-color: #2ea043; }
        #send-btn:disabled { background-color: #30363d; cursor: not-allowed; }
        #memory-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 100; }
        .modal-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; width: 90%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
        .modal-card h3 { color: #58a6ff; }
        .modal-card p { font-size: 0.85rem; color: #8b949e; }
        textarea { width: 100%; height: 120px; background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 10px; border-radius: 8px; resize: vertical; font-size: 0.9rem; outline: none; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
        </div>
        <div class="sidebar-chats" id="sidebar-chats"></div>
    </div>
    <div id="main-area">
        <header>
            <h1 id="top-title">☁️ Aerocloud AI</h1>
            <div class="controls">
                <button class="btn-sm" onclick="changeName()">👤 Name</button>
                <button class="btn-sm" onclick="openMemory()">🧠 AI Memories</button>
                <button class="btn-sm btn-danger" onclick="clearCurrentChat()">🗑️ Clear</button>
            </div>
        </header>
        <div id="chat-box">
            <div id="welcome-screen">
                <h2 id="greeting-text">Hey, Vihaan</h2>
            </div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type a prompt or code question..." autocomplete="off" />
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>
    <div id="memory-modal">
        <div class="modal-card">
            <h3>🧠 AI Persistent Memory</h3>
            <p>Add facts or hardware details you want Aerocloud AI to remember across chats.</p>
            <textarea id="memory-input" placeholder="- Fedora Linux 45\n- Python & Docker"></textarea>
            <div class="modal-actions">
                <button class="btn-sm" onclick="closeMemory()">Cancel</button>
                <button class="btn-sm" style="background:#238636;color:#fff;border:none;" onclick="saveMemory()">Save</button>
            </div>
        </div>
    </div>
    <script>
        const chatBox = document.getElementById("chat-box");
        const welcomeScreen = document.getElementById("welcome-screen");
        const greetingText = document.getElementById("greeting-text");
        const input = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const sidebarChats = document.getElementById("sidebar-chats");

        let userName = localStorage.getItem("aerocloud_name") || "Vihaan";
        let memories = localStorage.getItem("aerocloud_memories") || "";
        let allChats = JSON.parse(localStorage.getItem("aerocloud_all_chats") || "[]");
        let currentChatId = localStorage.getItem("aerocloud_current_id") || null;

        if (allChats.length === 0) {
            createNewChat(false);
        } else if (!currentChatId || !allChats.find(c => c.id === currentChatId)) {
            currentChatId = allChats[0].id;
        }

        function updateGreeting() {
            greetingText.textContent = `Hey, ${userName}`;
        }

        function saveState() {
            localStorage.setItem("aerocloud_all_chats", JSON.stringify(allChats));
            localStorage.setItem("aerocloud_current_id", currentChatId);
        }

        function renderSidebar() {
            sidebarChats.innerHTML = "";
            allChats.forEach(chat => {
                const div = document.createElement("div");
                div.className = `chat-item ${chat.id === currentChatId ? "active" : ""}`;
                const titleSpan = document.createElement("span");
                titleSpan.textContent = chat.title || "New Chat";
                titleSpan.style.flex = "1";
                titleSpan.onclick = () => switchChat(chat.id);
                const delBtn = document.createElement("button");
                delBtn.className = "chat-del";
                delBtn.textContent = "✕";
                delBtn.onclick = (e) => { e.stopPropagation(); deleteChat(chat.id); };
                div.appendChild(titleSpan);
                div.appendChild(delBtn);
                sidebarChats.appendChild(div);
            });
        }

        function getCurrentChat() {
            return allChats.find(c => c.id === currentChatId) || allChats[0];
        }

        function renderCurrentChat() {
            updateGreeting();
            chatBox.innerHTML = "";
            const chat = getCurrentChat();
            if (chat.messages.length > 0) {
                welcomeScreen.style.display = "none";
                chat.messages.forEach(msg => appendBubble(msg.content, msg.role === "user" ? "user" : "ai", false));
            } else {
                chatBox.appendChild(welcomeScreen);
                welcomeScreen.style.display = "block";
            }
            renderSidebar();
        }

        function createNewChat(switchNow = true) {
            const newChat = { id: "chat_" + Date.now(), title: "New Chat", messages: [] };
            allChats.unshift(newChat);
            if (switchNow) currentChatId = newChat.id;
            saveState();
            renderCurrentChat();
        }

        function switchChat(id) {
            currentChatId = id;
            saveState();
            renderCurrentChat();
        }

        function deleteChat(id) {
            allChats = allChats.filter(c => c.id !== id);
            if (allChats.length === 0) createNewChat(true);
            else if (currentChatId === id) currentChatId = allChats[0].id;
            saveState();
            renderCurrentChat();
        }

        function clearCurrentChat() {
            const chat = getCurrentChat();
            chat.messages = [];
            chat.title = "New Chat";
            saveState();
            renderCurrentChat();
        }

        function appendBubble(text, sender, isMarkdown = true) {
            welcomeScreen.style.display = "none";
            const div = document.createElement("div");
            div.className = `msg ${sender}`;
            if (sender === "ai" && isMarkdown) {
                div.innerHTML = marked.parse(text);
                div.querySelectorAll("pre").forEach(pre => {
                    const btn = document.createElement("button");
                    btn.className = "copy-btn";
                    btn.textContent = "Copy";
                    btn.onclick = () => {
                        navigator.clipboard.writeText(pre.querySelector("code").innerText);
                        btn.textContent = "Copied!";
                        setTimeout(() => btn.textContent = "Copy", 2000);
                    };
                    pre.appendChild(btn);
                });
            } else {
                div.textContent = text;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function changeName() {
            const newName = prompt("Enter your name:", userName);
            if (newName && newName.trim()) {
                userName = newName.trim();
                localStorage.setItem("aerocloud_name", userName);
                updateGreeting();
            }
        }

        function openMemory() {
            document.getElementById("memory-input").value = memories;
            document.getElementById("memory-modal").style.display = "flex";
        }

        function closeMemory() {
            document.getElementById("memory-modal").style.display = "none";
        }

        function saveMemory() {
            memories = document.getElementById("memory-input").value;
            localStorage.setItem("aerocloud_memories", memories);
            closeMemory();
        }

        input.addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            const chat = getCurrentChat();
            if (chat.messages.length === 0) {
                chat.title = text.length > 25 ? text.substring(0, 25) + "..." : text;
            }
            appendBubble(text, "user", false);
            chat.messages.push({ role: "user", content: text });
            saveState();
            renderSidebar();

            input.value = "";
            sendBtn.disabled = true;
            const loadingMsg = appendBubble("Thinking...", "ai", false);

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: chat.messages.slice(0, -1),
                        userName: userName,
                        memories: memories
                    })
                });
                const data = await res.json();
                if (data.response) {
                    loadingMsg.remove();
                    appendBubble(data.response, "ai", true);
                    chat.messages.push({ role: "assistant", content: data.response });
                    saveState();
                } else {
                    loadingMsg.textContent = "Error: " + data.error;
                }
            } catch (err) {
                loadingMsg.textContent = "Connection error.";
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        renderCurrentChat();
    </script>
</body>
</html>
